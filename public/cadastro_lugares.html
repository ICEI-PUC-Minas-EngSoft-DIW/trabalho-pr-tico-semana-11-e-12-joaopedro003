<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorando Lugares e Experiências</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="text-center text-white py-5 bg-gradient">
    <h1>Explorando Lugares e Experiências</h1>
    <p class="lead">Descubra destinos incríveis e planeje sua próxima aventura</p>
  </header>

  <main class="container py-5 main-content">
    
    <h2 class="text-center mb-4">✈️ Destaques da Semana</h2>
    <div class="mb-5">
      <div id="carouselDestaques" class="carousel slide" data-bs-ride="carousel">
        <div id="carousel-inner" class="carousel-inner">
          </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselDestaques" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselDestaques" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Próximo</span>
        </button>
      </div>
    </div>
    
    <h2 class="text-center mb-4">🌍 Todos os Destinos</h2>
    <div id="cards-container" class="row g-4"></div>
  </main>

  <footer class="text-center py-4 text-white">
    <div class="container">
      <p class="mb-0">© 2025 Explorando Lugares</p>
      <div class="author-info">
        <p class="mb-1 fw-bold">Autor(a):</p>
        <p class="mb-1">João Pedro Alvarenga Santos</p>
        <p class="mb-1">Curso: Engenharia de Software</p>
        <p class="mb-0">Turma: Noite</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
